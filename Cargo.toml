[workspace]
members = ["crates/treasurylens-core", "lyquids/treasurylens", "lyquids/budget-monitor", "lyquids/treasurylens-test"]
exclude = [".tools/ldk"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lyquid = { path = ".tools/ldk/lyquid", features = ["ldk"] }
treasurylens-core = { path = "crates/treasurylens-core" }

[profile.release]
strip = "debuginfo"
debug = false
lto = true
